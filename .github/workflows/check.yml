name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  catalogues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Every committed JSON matches its sources
        run: uv run build.py --check
